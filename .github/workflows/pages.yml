name: Test and deploy kanacard
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify game and animation
        run: |
          node tests/game.cjs
          node tests/app.cjs
          node tests/word-effects.cjs
          node tests/pwa.cjs
          node tests/world.cjs
          node tests/music.cjs
      - name: Prepare public files
        run: |
          mkdir -p _site
          cp index.html style.css lessons.js portraits.js world-config.js core.js world.js world-view.js world-art.js music.js monsters.js combat-actor.js word-effects.js app.js motion-preview.html pwa.js viewport.js sw.js manifest.webmanifest recover.html recovery.js _site/
          cp -R icons _site/
          touch _site/.nojekyll
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: '_site'
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
