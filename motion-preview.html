<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>장비 외형과 공격 모션 미리보기</title><link rel="stylesheet" href="style.css"><style>main{max-width:1000px;padding-top:40px}.preview-controls{display:flex;gap:12px;flex-wrap:wrap;margin:20px 0}.combat-layout .battlefield{align-items:flex-end}.combat-layout .unit{padding-bottom:50px}.preview-note{font-size:13px;color:var(--muted)}.hero-actor .fighter-rig{visibility:visible!important}.battlefield{--dash-distance:130px}h1{font-size:26px}.appearance-gallery{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin:24px 0}.appearance-card{background:#17242e;border:1px solid #586b7e;border-radius:14px;padding:12px;color:#eee;text-align:center}.appearance-card svg{width:150px;height:185px;max-width:100%}.appearance-card small{display:block;color:#bdc8d6;font-size:11px}.appearance-card[aria-pressed=true]{border-color:#f1cf86;box-shadow:0 0 0 1px #f1cf86}.preview-controls label{display:flex;gap:6px;align-items:center}</style></head><body><main><h1>장비 외형과 공격 모션</h1><p class="preview-note">장비 세트를 고르고 공격 모션을 확인하세요. 아래 외형을 누르면 전투 미리보기에 적용됩니다.</p><div class="preview-controls"><select id="hero" aria-label="캐릭터"></select><label>등급 <select id="grade"><option value="common">일반</option><option value="rare">희귀</option><option value="legendary" selected>전설</option><option value="mythic">신화</option></select></label><label>강화 <select id="enhance"><option value="0">+0</option><option value="5">+5 각성 문양</option><option value="10" selected>+10 완전 각성</option></select></label><button id="attack" class="primary">공격 다시 보기</button><a class="secondary" href="index.html">게임으로 돌아가기</a></div><div class="combat-layout"><section id="arena" class="battlefield"><div class="unit hero-unit"><div id="actor" class="hero-actor"></div></div><div class="unit enemy-unit"><svg viewBox="0 0 160 170" aria-hidden="true"><ellipse cx="80" cy="145" rx="48" ry="12" fill="#101c17"/><path d="M25 130 Q15 60 80 40 Q145 60 135 130Z" fill="#819a78" stroke="#26372a" stroke-width="4"/><path d="M45 88 L65 94 M95 94 L115 88" stroke="#1b2922" stroke-width="7"/><text x="80" y="73" text-anchor="middle" fill="#e7d4a1" font-size="24">言</text></svg></div></section></div><h2>지역 장비 · 보스 고유 장비</h2><div id="gallery" class="appearance-gallery"></div><p class="preview-note">기기에서 ‘동작 줄이기’를 켰다면 공격 움직임은 생략됩니다.</p></main><script src="world-config.js"></script><script src="core.js"></script><script src="gear-config.js"></script><script src="gear.js"></script><script src="combat-actor.js"></script><script>
const hero=document.getElementById('hero'),arena=document.getElementById('arena'),actor=document.getElementById('actor'),attack=document.getElementById('attack'),grade=document.getElementById('grade'),enhance=document.getElementById('enhance'),gallery=document.getElementById('gallery');let timer,selected=0;
hero.innerHTML=KanaGame.HEROES.map(h=>`<option value="${h.id}">${h.name}</option>`).join('');
function equipment(index){return Object.fromEntries(['weapon','armor','charm'].map(slot=>[slot,{slot,region:index%6,origin:index>=6?'boss':'field',grade:grade.value,level:Number(enhance.value)}]));}
function character(){const h=KanaGame.HEROES.find(h=>h.id===hero.value);return h.id==='mage'?{...h,archetype:'warrior'}:h;}
function showGallery(){gallery.innerHTML=Array.from({length:12},(_,i)=>{const load=equipment(i);return `<button class="appearance-card" data-look="${i}" aria-pressed="${selected===i}">${combatActor(character(),load)}<strong>${KanaGear.appearance(load.weapon).type}</strong><small>${KanaGear.appearance(load.armor).type}</small><small>${i>=6?'보스 고유':'지역 장비'} · ${KanaGear.grade(grade.value).name} +${enhance.value}</small></button>`}).join('');}
function show(){clearTimeout(timer);arena.className='battlefield';actor.innerHTML=combatActor(character(),equipment(selected));attack.disabled=false}
hero.onchange=grade.onchange=enhance.onchange=()=>{show();showGallery();};gallery.onclick=e=>{const b=e.target.closest('[data-look]');if(!b)return;selected=Number(b.dataset.look);show();showGallery();};attack.onclick=()=>{show();const a=actor.getBoundingClientRect(),e=arena.querySelector('.enemy-unit svg').getBoundingClientRect();arena.style.setProperty('--dash-distance',Math.max(0,e.left-a.right+38)+'px');void arena.offsetWidth;arena.className='battlefield animating fx-scene-slash';attack.disabled=true;timer=setTimeout(show,900)};show();showGallery();
</script></body></html>
