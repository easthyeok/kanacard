<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>공격 모션 미리보기</title><link rel="stylesheet" href="style.css"><style>main{max-width:1000px;padding-top:40px}.preview-controls{display:flex;gap:12px;flex-wrap:wrap;margin:20px 0}.combat-layout .battlefield{align-items:flex-end}.combat-layout .unit{padding-bottom:50px}.preview-note{font-size:13px;color:var(--muted)}.hero-actor .fighter-rig{visibility:visible!important}.battlefield{--dash-distance:130px}h1{font-size:26px}</style></head><body><main><h1>공격 모션 미리보기</h1><p class="preview-note">캐릭터를 고르고 공격을 눌러 준비 자세 → 돌진 → 무기 휘두르기 → 복귀를 확인하세요.</p><div class="preview-controls"><select id="hero" aria-label="캐릭터"></select><button id="attack" class="primary">공격 다시 보기</button><a class="secondary" href="index.html">게임으로 돌아가기</a></div><div class="combat-layout"><section id="arena" class="battlefield"><div class="unit hero-unit"><div id="actor" class="hero-actor"></div></div><div class="unit enemy-unit"><svg viewBox="0 0 160 170" aria-hidden="true"><ellipse cx="80" cy="145" rx="48" ry="12" fill="#101c17"/><path d="M25 130 Q15 60 80 40 Q145 60 135 130Z" fill="#819a78" stroke="#26372a" stroke-width="4"/><path d="M45 88 L65 94 M95 94 L115 88" stroke="#1b2922" stroke-width="7"/><text x="80" y="73" text-anchor="middle" fill="#e7d4a1" font-size="24">言</text></svg></div></section></div><p class="preview-note">기기에서 ‘동작 줄이기’를 켰다면 공격 움직임은 생략됩니다.</p></main><script src="world-config.js"></script><script src="core.js"></script><script src="combat-actor.js"></script><script>
const hero=document.getElementById('hero'),arena=document.getElementById('arena'),actor=document.getElementById('actor'),attack=document.getElementById('attack');let timer;
hero.innerHTML=KanaGame.HEROES.map(h=>`<option value="${h.id}">${h.name}</option>`).join('');
function show(){clearTimeout(timer);arena.className='battlefield';actor.innerHTML=combatActor(KanaGame.HEROES.find(h=>h.id===hero.value));attack.disabled=false}
hero.onchange=show;attack.onclick=()=>{show();const a=actor.getBoundingClientRect(),e=arena.querySelector('.enemy-unit svg').getBoundingClientRect();arena.style.setProperty('--dash-distance',Math.max(0,e.left-a.right+38)+'px');void arena.offsetWidth;arena.className='battlefield animating fx-scene-slash';attack.disabled=true;timer=setTimeout(show,900)};show();
</script></body></html>
